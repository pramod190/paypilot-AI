# Render Blueprint: one web service (API + built React app) + managed PostgreSQL.
# Deploy: Render dashboard -> New -> Blueprint -> select this repo.
# After the first deploy, set the secret values marked `sync: false` in the Render dashboard.
databases:
  - name: paypilot-db
    plan: free
    databaseName: paypilot
    user: paypilot

services:
  - type: web
    name: paypilot-ai
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: paypilot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_LOGIN_ENABLED
        value: "true"
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false   # set to your Render URL, e.g. https://paypilot-ai.onrender.com
      - key: PAYPAL_RETURN_URL
        sync: false   # <CLIENT_URL>/payment/success
      - key: PAYPAL_CANCEL_URL
        sync: false   # <CLIENT_URL>/payment/cancel
