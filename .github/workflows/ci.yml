name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: paypilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/paypilot_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/paypilot_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations to the test database
        run: npm run db:migrate
      - name: Type-check (shared, API, web)
        run: npm run lint
      - name: Tests (mocked PayPal; real PostgreSQL)
        run: npm test
      - name: Build
        run: npm run build
      - name: Secret scan (fail on committed credentials)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
